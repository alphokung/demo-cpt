<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บริการอื่นๆ — ทางรัฐ</title>
  <meta name="author" content="สำนักงานพัฒนารัฐบาลดิจิทัล (องค์การมหาชน)">
  <link rel="icon" type="image/x-icon" href="../../favicon/favicon.ico">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../dashboard-components.css">
  <link rel="stylesheet" href="../health/health.css">
  <link rel="stylesheet" href="crime.css">
</head>
<body>
  <div class="app-container">
    <div class="main-layout">

      <div class="top-nav-bar">
        <div class="top-nav-bar-content">
          <a href="index.html" class="btn-back-circle" title="ย้อนกลับ">
            <span class="material-symbols-outlined">arrow_back</span>
          </a>
          <div class="top-nav-bar-icon">
            <span class="material-symbols-outlined">local_police</span>
          </div>
          <p class="top-nav-bar-title">Crime Portal</p>
        </div>
      </div>

      <main class="hp-main">
        <!-- หน้าตาเดียวกับ "บริการแนะนำสำหรับคุณ" ใน dashboard-with-consent.html -->
        <div class="card">
          <div class="hp-section-head">
            <div class="section-title-container card-section__title-container">
              <div class="section-bar card-section__bar--primary"></div>
              <h3 class="section-title card-section__heading">บริการอื่นๆ</h3>
            </div>
          </div>
          <p class="list-section-note">กดเพื่อเปิดบริการในเว็บไซต์ของหน่วยงานเจ้าของบริการ</p>
          <div class="cert-list" id="services"></div>
        </div>

        <div class="source-note">
          <p class="source-note-text">
            <span class="material-symbols-outlined source-note-icon">open_in_new</span>
            บริการเหล่านี้เปิดในเว็บไซต์ของหน่วยงานเจ้าของบริการ<br>
            อัปเดตล่าสุด: <span class="source-note-time"></span>
          </p>
        </div>
      </main>
    </div>
  </div>

  <button class="back-to-top" id="back-to-top" aria-label="กลับขึ้นด้านบน"
          onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span class="material-symbols-outlined">arrow_upward</span>
  </button>

  <script src="../../alert.js"></script>
  <script src="crime-data.js"></script>
  <script src="crime.js"></script>
  <script>
    (function () {
      var e = CP.esc;
      CP.mountWelcome('บริการอื่นๆ', 'บริการที่เกี่ยวข้องจากหน่วยงานภาครัฐและภาคประชาสังคม');

      document.getElementById('services').innerHTML = CRIME.services.filter(function (s) { return s.listed !== false; }).map(function (s) {
        return '<a href="' + e(s.url) + '" target="_blank" rel="noopener" class="list-item" data-ext="' + s.key + '">' +
          '<div class="list-icon"><span class="hp-icon tone-' + s.tone + '"><span class="material-symbols-outlined">' + s.icon + '</span></span></div>' +
          '<div class="list-body">' +
            '<p class="service-item__title">' + e(s.name) + '</p>' +
            '<p class="service-item__desc">' + e(s.desc) + '</p>' +
            '<span class="service-item__category">' + e(s.category) + '</span>' +
          '</div>' +
          '<span class="material-symbols-outlined chevron">chevron_right</span>' +
        '</a>';
      }).join('');
    })();
  </script>
</body>
</html>
