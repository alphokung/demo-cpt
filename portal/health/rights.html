<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สิทธิการรักษาพยาบาล — ทางรัฐ</title>
  <meta name="description" content="ตรวจสอบสิทธิการรักษาพยาบาล — บัตรทอง (สปสช.) ประกันสังคม และสวัสดิการข้าราชการ พร้อมสิทธิประโยชน์ที่ได้รับ">
  <meta name="author" content="สำนักงานพัฒนารัฐบาลดิจิทัล (องค์การมหาชน)">
  <link rel="icon" type="image/x-icon" href="../../favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../dashboard-components.css">
  <link rel="stylesheet" href="health.css">
</head>
<body>
  <div class="app-container">
    <div class="main-layout">

      <div class="top-nav-bar">
        <div class="top-nav-bar-content">
          <a href="index.html" class="btn-back-circle" title="ย้อนกลับ">
            <span class="material-symbols-outlined">arrow_back</span>
          </a>
          <div class="top-nav-bar-icon">
            <span class="material-symbols-outlined">health_and_safety</span>
          </div>
          <p class="top-nav-bar-title">Health Portal</p>
        </div>
      </div>

      <main class="hp-main">

        <!-- ตัวสลับสิทธิสำหรับสาธิต -->
        <div class="hp-demo-switch">
          <span class="hp-demo-switch-label"><span class="material-symbols-outlined">science</span>โหมดสาธิต — เลือกดูหน้าตาของแต่ละสิทธิ</span>
          <div class="filter-row" id="right-switch"></div>
        </div>

        <!-- สิทธิหลัก -->
        <div class="card" id="hero"></div>

        <div class="hp-grid-2">
          <div class="card" id="fields"></div>
          <div class="card" id="contact"></div>
        </div>

        <!-- สิทธิประโยชน์หลัก -->
        <div class="card" id="benefits"></div>

        <!-- สิทธิประโยชน์ด้านส่งเสริมสุขภาพและป้องกันโรค (จาก Excel สปสช.) -->
        <div class="card" id="nhso">
          <div class="hp-section-head">
            <div class="section-title-container">
              <div class="section-bar" style="background-color: var(--primary-40);"></div>
              <h3 class="section-title">สิทธิประโยชน์ส่งเสริมสุขภาพและป้องกันโรค (สปสช.)</h3>
            </div>
            <a class="hp-link" href="data/nhso-benefits-sample.xlsx" download>
              <span class="material-symbols-outlined">download</span>Excel
            </a>
          </div>
          <div class="hp-notice" style="margin-bottom: var(--spacing-lg);">
            <span class="material-symbols-outlined">info</span>
            <div id="nhso-note"></div>
          </div>

          <div class="hp-toolbar">
            <label class="hp-search">
              <span class="material-symbols-outlined">search</span>
              <input type="search" id="bn-search" placeholder="ค้นหาสิทธิประโยชน์ เช่น วัคซีน ฟัน ตรวจเลือด" aria-label="ค้นหาสิทธิประโยชน์">
            </label>
            <div class="filter-row" id="bn-filters"></div>
            <p class="hp-count" id="bn-count"></p>
          </div>

          <div class="accordion" id="bn-list"></div>
        </div>

        <div class="source-note">
          <p class="source-note-text">
            <span class="material-symbols-outlined source-note-icon">verified</span>
            <span id="source-agency"></span><br>
            อัปเดตล่าสุด: <span class="source-note-time"></span>
          </p>
        </div>

      </main>
    </div>
  </div>

  <button class="back-to-top" id="back-to-top" aria-label="กลับขึ้นด้านบน"
          onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span class="material-symbols-outlined">arrow_upward</span>
  </button>

  <script src="../../alert.js"></script>
  <script src="health-data.js"></script>
  <script src="nhso-benefits.js"></script>
  <script src="health.js"></script>
  <script>
    (function () {
      var H = HEALTH, e = HP.esc, schemes = H.rights.schemes;
      var age = HP.age(), isMale = H.user.sex === 'ชาย';

      var GROUPS = [
        { key: 'mine',   label: 'เหมาะกับคุณ', icon: 'person_check' },
        { key: 'all',    label: 'ทั้งหมด' },
        { key: 'other',  label: 'ตรวจสุขภาพอื่น ๆ' },
        { key: 'young',  label: 'เด็ก-วัยรุ่น (0–24 ปี)' },
        { key: 'adult',  label: 'วัยทำงาน (25–49 ปี)' },
        { key: 'senior', label: 'ผู้สูงอายุ (50 ปีขึ้นไป)' },
        { key: 'women',  label: 'เฉพาะสตรี' }
      ];
      var GROUP_LABEL = {};
      GROUPS.forEach(function (g) { GROUP_LABEL[g.key] = g.label; });
      // แถวที่เป็นบริการสำหรับผู้ป่วยโรคนั้น ๆ → แนะนำเฉพาะผู้ที่มีโรคประจำตัวตรงกัน
      var DISEASE_ROWS = { 'โรคความดันโลหิตสูง': 'hypertension', 'โรคเบาหวาน': 'diabetes' };

      var state = { right: HP.currentRightKey(), filter: 'mine', q: '' };

      /* ─── รวมแถวที่ซ้ำกัน (เช่น ถุงยางอนามัยหลายขนาด) ─── */
      var items = [];
      NHSO_BENEFITS.forEach(function (r) {
        var same = items.filter(function (i) { return i.main === r.main && i.cond === r.cond; })[0];
        if (same && r.sub) { same.subs.push(r.sub); return; }
        items.push({ main: r.main, subs: r.sub ? [r.sub] : [], detail: r.detail, cond: r.cond, start: r.start, end: r.end, g: r.g });
      });
      items.forEach(function (i) {
        i.merged = i.subs.length > 1;
        i.title = (!i.merged && i.subs[0]) ? i.subs[0] : i.main;
        i.groups = Object.keys(i.g).filter(function (k) { return i.g[k]; });
        i.ucsOnly = /ผู้มีสิทธิหลักประกันสุขภาพแห่งชาติ/.test(i.cond);
        i.disease = DISEASE_ROWS[i.main] || null;
      });

      /* ─── ตรวจว่าผู้ใช้เข้าเงื่อนไขหรือไม่ (อายุ / เพศ / โรคประจำตัว / สิทธิ) ─── */
      function ageGroup() { return age < 25 ? 'young' : age < 50 ? 'adult' : 'senior'; }
      function ageRanges(cond) {
        var out = [], m, re = /(\d+)\s*-\s*(\d+)\s*ปี|(\d+)\s*ปี\s*ขึ้นไป/g;
        while ((m = re.exec(cond))) out.push(m[3] ? [+m[3], 200] : [+m[1], +m[2]]);
        return out;
      }
      function eligible(i) {
        if (i.ucsOnly && state.right !== 'ucs') return false;
        if (i.disease) return H.user.conditions.indexOf(i.disease) >= 0;
        if (isMale && /เพศหญิง|สตรี/.test(i.cond + i.main) && !/เพศชาย/.test(i.cond)) return false;
        if (isMale && i.groups.length === 1 && i.g.women) return false;
        var inGroup = i.g[ageGroup()] || (i.g.other && !i.g.young && !i.g.adult && !i.g.senior && !i.g.women);
        var chronicMatch = /โรคเรื้อรัง/.test(i.cond) && H.user.conditions.length > 0;
        if (!inGroup && !chronicMatch) return false;
        if (chronicMatch) return true; // กลุ่มเสี่ยงโรคเรื้อรังไม่จำกัดอายุ
        var ranges = ageRanges(i.cond);
        if (ranges.length && !ranges.some(function (r) { return age >= r[0] && age <= r[1]; })) return false;
        return true;
      }

      /* ─── Render: switcher ─── */
      function renderSwitch() {
        document.getElementById('right-switch').innerHTML = Object.keys(schemes).map(function (k) {
          var s = schemes[k];
          return '<button class="filter-chip' + (k === state.right ? ' active' : '') + '" data-right="' + k + '">' +
            e(s.shortName) + (k === H.rights.current ? ' · สิทธิของคุณ' : '') + '</button>';
        }).join('');
        document.querySelectorAll('[data-right]').forEach(function (b) {
          b.onclick = function () { state.right = b.dataset.right; HP.setRightKey(state.right); renderAll(); };
        });
      }

      /* ─── Render: right detail ─── */
      function renderRight() {
        var s = schemes[state.right];
        var isReal = state.right === H.rights.current;
        document.getElementById('hero').innerHTML =
          '<div class="hp-right-hero">' +
            '<span class="hp-icon hp-icon--lg tone-' + s.tone + '"><span class="material-symbols-outlined">' + s.icon + '</span></span>' +
            '<div style="flex:1;min-width:0">' +
              '<div class="hp-row">' +
                '<span class="tag tag--success tag--sm tag--dot">ใช้สิทธิได้</span>' +
                '<span class="tag tag--sm">รหัสสิทธิ ' + e(s.code) + '</span>' +
                (isReal ? '' : '<span class="tag tag--warning tag--sm">ข้อมูลตัวอย่าง</span>') +
              '</div>' +
              '<p class="hp-muted" style="margin-top:var(--spacing-sm)">คุณใช้สิทธิ</p>' +
              '<p class="hp-right-name">' + e(s.name) + '</p>' +
              '<p class="hp-right-summary">' + e(s.summary) + '</p>' +
              '<p class="hp-muted" style="margin-top:var(--spacing-sm)">ตรวจสอบสิทธิล่าสุด ' + HP.dateLong(H.rights.checkedAt) + ' เวลา ' + HP.time(H.rights.checkedAt) + '</p>' +
            '</div>' +
          '</div>';

        document.getElementById('fields').innerHTML = HP.sectionTitle('ข้อมูลสิทธิ') +
          '<div class="details-list">' + s.fields.map(function (f) {
            var v = f.type === 'date' ? HP.dateLong(f.value) : e(f.value);
            var cls = f.status === 'positive' ? 'details-value-paid' : '';
            return '<div class="details-item"><span class="details-label">' + e(f.label) + '</span>' +
              '<span class="details-value ' + cls + '">' + v + '</span>' +
              (f.sub ? '<span class="details-subvalue">' + e(f.sub) + '</span>' : '') + '</div>';
          }).join('') + '</div>';

        document.getElementById('contact').innerHTML = HP.sectionTitle('หน่วยงานที่ดูแลสิทธิ', 'var(--secondary-40-main)') +
          '<div class="details-list">' +
            HP.detailsItem('หน่วยงาน', e(s.agency)) +
            HP.detailsItem('สายด่วน', e(s.hotline)) +
          '</div>' +
          '<div class="hp-notice" style="margin:var(--spacing-lg) 0"><span class="material-symbols-outlined">lightbulb</span><div>' + e(s.notes) + '</div></div>' +
          '<a class="btn btn-secondary" href="tel:' + s.hotline.replace(/[^0-9]/g, '') + '">' +
            '<span class="material-symbols-outlined">call</span>โทร ' + e(s.hotline) + '</a>';

        document.getElementById('benefits').innerHTML = HP.sectionTitle('สิทธิประโยชน์ที่คุณได้รับ', 'var(--primary-40)') +
          '<p class="hp-muted" style="margin-bottom:var(--spacing-lg)">ความคุ้มครองหลักของ' + e(s.name) + '</p>' +
          '<div class="hp-benefits">' + s.benefits.map(function (b) {
            return '<div class="hp-benefit"><span class="hp-icon hp-icon--sm tone-' + s.tone + '"><span class="material-symbols-outlined">' + b.icon + '</span></span>' +
              '<div><p class="hp-benefit-title">' + e(b.title) + '</p><p class="hp-benefit-desc">' + e(b.desc) + '</p></div></div>';
          }).join('') + '</div>';

        document.getElementById('nhso-note').innerHTML =
          'บริการส่งเสริมสุขภาพและป้องกันโรคของ สปสช. ครอบคลุม<strong>คนไทยทุกคนทุกสิทธิ</strong> ' +
          (state.right === 'ucs' ? '' : 'ยกเว้นรายการที่ระบุ "เฉพาะสิทธิบัตรทอง" ') +
          '· "เหมาะกับคุณ" คัดจากอายุ ' + age + ' ปี เพศ' + e(H.user.sex) + ' และโรคประจำตัวของคุณ';

        document.getElementById('source-agency').textContent = 'ข้อมูลจาก ' + s.agency;
      }

      /* ─── Render: NHSO catalogue ─── */
      function renderFilters() {
        document.getElementById('bn-filters').innerHTML = GROUPS.map(function (g) {
          return '<button class="filter-chip' + (g.key === state.filter ? ' active' : '') + '" data-filter="' + g.key + '">' +
            (g.icon ? '<span class="material-symbols-outlined" style="font-size:16px">' + g.icon + '</span>' : '') + g.label + '</button>';
        }).join('');
        document.querySelectorAll('[data-filter]').forEach(function (b) {
          b.onclick = function () { state.filter = b.dataset.filter; renderFilters(); renderList(); };
        });
      }

      function periodTag(i) {
        var dEnd = HP.daysUntil(i.end), dStart = HP.daysUntil(i.start);
        if (dStart > 0) return '<span class="tag tag--info tag--sm">เริ่ม ' + HP.dateShort(i.start) + '</span>';
        if (dEnd < 0) return '<span class="tag tag--sm">สิ้นสุดแล้ว</span>';
        if (dEnd <= 30) return '<span class="tag tag--warning tag--sm">ใช้ได้ถึง ' + HP.dateShort(i.end) + '</span>';
        return '<span class="tag tag--success tag--sm">เปิดให้บริการ</span>';
      }

      function renderList() {
        var q = state.q.trim().toLowerCase();
        var list = items.filter(function (i) {
          if (state.filter === 'mine' && !eligible(i)) return false;
          if (state.filter !== 'mine' && state.filter !== 'all' && !i.g[state.filter]) return false;
          if (q && (i.title + i.main + i.detail + i.cond + i.subs.join(' ')).toLowerCase().indexOf(q) < 0) return false;
          return true;
        });

        document.getElementById('bn-count').textContent = 'พบ ' + list.length + ' รายการ' +
          (state.filter === 'mine' ? ' ที่คุณมีสิทธิรับบริการ' : '');

        if (!list.length) {
          document.getElementById('bn-list').innerHTML =
            '<div class="hp-empty"><span class="material-symbols-outlined">search_off</span>ไม่พบสิทธิประโยชน์ที่ตรงกับเงื่อนไข</div>';
          return;
        }

        document.getElementById('bn-list').innerHTML = list.map(function (i) {
          var mine = eligible(i);
          var tags = '';
          if (i.disease && H.user.conditions.indexOf(i.disease) >= 0) tags += '<span class="tag tag--danger tag--sm">ตรงกับโรคประจำตัวของคุณ</span>';
          else if (mine && state.filter !== 'mine') tags += '<span class="tag tag--primary tag--sm">เหมาะกับคุณ</span>';
          if (i.ucsOnly) tags += '<span class="tag tag--info tag--sm">เฉพาะสิทธิบัตรทอง</span>';
          tags += periodTag(i);

          var body =
            '<div class="hp-kv">' +
              '<div><p class="hp-kv-label">สิทธิที่ได้รับ</p><p class="hp-kv-value">' + e(i.detail) + '</p></div>' +
              (i.merged ? '<div><p class="hp-kv-label">ตัวเลือก</p><div class="hp-group-grid">' + i.subs.map(function (s) { return '<span class="tag">' + e(s) + '</span>'; }).join('') + '</div></div>' : '') +
              '<div><p class="hp-kv-label">เงื่อนไขการรับสิทธิ</p><p class="hp-kv-value">' + e(i.cond) + '</p></div>' +
              '<div><p class="hp-kv-label">ระยะเวลาให้บริการ</p><p class="hp-kv-value">' + HP.dateLong(i.start) + ' – ' + HP.dateLong(i.end) + '</p></div>' +
              '<div><p class="hp-kv-label">กลุ่มเป้าหมาย</p><div class="hp-group-grid">' + i.groups.map(function (g) { return '<span class="tag tag--sm">' + GROUP_LABEL[g] + '</span>'; }).join('') + '</div></div>' +
            '</div>';

          return '<div class="accordion-item">' +
            '<div class="accordion-header" onclick="toggleAccordion(this)">' +
              '<div class="hp-bn-head"><span class="accordion-title">' + e(i.title) + '</span>' +
                (i.title !== i.main ? '<span class="hp-bn-sub">' + e(i.main) + '</span>' : '') +
                '<div class="hp-bn-tags">' + tags + '</div></div>' +
              '<span class="accordion-icon"><span class="material-symbols-outlined">expand_more</span></span>' +
            '</div>' +
            '<div class="accordion-body"><div class="accordion-body-inner">' + body + '</div></div>' +
          '</div>';
        }).join('');
      }

      document.getElementById('bn-search').addEventListener('input', function () { state.q = this.value; renderList(); });

      function renderAll() { renderSwitch(); renderRight(); renderFilters(); renderList(); }
      renderAll();
      HP.mountWelcome('สิทธิการรักษาพยาบาล', 'สิทธิที่คุณมี และสิทธิประโยชน์ที่ได้รับ');
    })();
  </script>
</body>
</html>
